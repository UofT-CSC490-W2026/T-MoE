# ============================================================================
# T-MoE Experiment Configuration — Baseline Defaults
# ============================================================================
# This file serves as the baseline fallback for all experiment configs.
# Experiment YAMLs in experiments/ inherit these defaults and override as needed.
#
# Used by:
#   - infra/config/config.py (data_ingestion, dataset, compute sections)
#   - scripts/train.py (model, router, expert, training, dataset, logging)
#   - run_aws_training.py, run_modal_training.py (compute sections)
#
# Usage:
#   python train.py --config experiments/my_experiment.yaml
#   python train.py --config config.yaml  # Uses these defaults directly
# ============================================================================

# Experiment Metadata
experiment_name: gptneo_lora_moe
seed: 42

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  # Model selection (uses catalog/model_catalog.py)
  model_key: gpt-neo-125m  # Options: gpt-neo-125m, gpt-neo-350m, gpt2, gpt2-medium, etc.

  # Custom model (overrides model_key if provided)
  custom_model_name: null  # e.g., "my-org/my-model"
  model_type: gpt_neo  # gpt_neo, gpt2, llama. Need to specify if using custom_model_name because of backbone loading logic.

  freeze_backbone: true
  moe_layer_indices: [-1]  # List of layer indices to inject MoE (-1 = last layer)

  # Model dimensions (auto-loaded from catalog or HuggingFace)
  hidden_dim: null  # Auto-detected
  num_layers: null  # Auto-detected
  vocab_size: null  # Auto-detected

# ============================================================================
# ROUTER CONFIGURATION
# ============================================================================
router:
  type: standard  # Options: standard, metabolic
  num_experts: 4
  top_k: 1
  hidden_dim: null  # Auto-set from model

  # Router-specific parameters
  temperature: 1.0
  noise_std: 0.0
  use_aux_loss: false
  aux_loss_coef: 0.01

  # Metabolic Router specific (only used if type=MetabolicRouter)
  metabolic:
    lambda_metabolic: 0.1
    mu_silicon: 0.0
    gamma_recovery: 0.01
    beta_cost: 0.04
    warmup_steps: 100
    normalize_inputs: true
    normalize_weights: true

# ============================================================================
# EXPERT CONFIGURATION
# ============================================================================
expert:
  type: gpt_neo_lora  # Options: gpt_neo_lora (future: gpt2_lora, llama_lora)
  count: 4  # Number of experts

  # LoRA-specific parameters
  lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    init_scale: 0.01

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Basic training
  batch_size: 8
  lr: 1.0e-3
  steps: 1000
  warmup_steps: 100

  # Optimizer
  optimizer: adamw
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

  # Gradient management
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  # Note: AMP is auto-detected via src.training.precision (float16/bfloat16)

  # Checkpointing
  save_interval: 500
  keep_last_n_checkpoints: 3
  save_best: true

  # Optional: Model compilation (PyTorch 2.0+)
  # compile: false  # Uncomment to enable torch.compile for faster training

  # Validation & Early Stopping
  eval_interval: 100
  early_stopping_patience: null  # null = disabled, int = number of eval steps

  # Logging (training loop)
  log_interval: 10

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset:
  # Dataset selection (uses catalog/dataset_catalog.py)
  dataset_key: wikitext-2  # Options: wikitext-2, wikitext-103, c4, openwebtext, the_pile, code

  # Custom dataset (overrides dataset_key if provided)
  custom_dataset_name: wikitext  # HuggingFace dataset name
  custom_dataset_config: wikitext-2-v1  # Required config: wikitext-103-raw-v1, wikitext-103-v1, wikitext-2-raw-v1, wikitext-2-v1
  text_column: text

  # Data processing
  max_seq_len: 512
  num_samples: null  # null = use entire dataset
  streaming: false

  # Data splits
  train_split: train
  eval_split: validation
  test_split: test

  # DataLoader (used by scripts/train.py)
  # Note: num_workers, prefetch_factor, shuffle, drop_last are auto-configured
  # based on distributed mode and CUDA availability

# ============================================================================
# LOGGING CONFIGURATION (WandB)
# ============================================================================
logging:
  # WandB settings
  enabled: true
  project: null  # Set via WANDB_PROJECT env var
  entity: null  # Set via WANDB_ENTITY env var
  group: null  # Optional experiment grouping
  tags: []  # List of tags for this run

  # Logging behavior
  mode: online  # Options: online, offline, disabled
  log_model: true  # Save model checkpoints as W&B artifacts
  log_gradients: false  # Log gradient histograms (expensive)
  log_interval: 10
  notes: null  # Optional notes for this run

# ============================================================================
# DISTRIBUTED TRAINING CONFIGURATION
# ============================================================================
# Multi-GPU training: Set num_gpus > 1 to enable FSDP via torchrun
# - Local: Use torchrun command manually (see train.py usage)
# - Modal: Automatically uses torchrun when num_gpus > 1
# - AWS: Automatically uses torchrun when num_gpus > 1
distributed:
  num_gpus: 1  # Set to number of GPUs (1 = single-GPU, 2+ = multi-GPU FSDP)

# ============================================================================
# DEVICE CONFIGURATION (Optional - auto-detected if not specified)
# ============================================================================
# Device selection is auto-detected by scripts/train.py:
#   - Distributed: uses CUDA via FSDP
#   - Single-GPU: auto-detects cuda/mps/cpu
#   - Precision: auto-detected via src.training.precision
#
# Optional overrides (if needed):
# device:
#   compile: false  # Use torch.compile (PyTorch 2.0+) - set via training.compile

# ============================================================================
# COMPUTE ENVIRONMENT CONFIGURATION
# ============================================================================
compute:
  # Backend: determines execution platform
  # Used by: run_aws_training.py, run_modal_training.py
  # Note: This is separate from scripts/train.py (which is backend-agnostic)
  backend: modal  # Options: aws, modal

  # ========================================
  # LOCAL EXECUTION
  # ========================================
  local:
    # Paths (used by local training workflows)
    data_root: ./data
    output_root: ./outputs
    cache_dir: ./cache

  # ========================================
  # AWS EXECUTION (EC2 + S3)
  # ========================================
  aws:
    # S3 Paths (update with your actual bucket names)
    data_root: s3://tmoe-data/datasets
    output_root: s3://tmoe-experiments/outputs
    cache_dir: /tmp/tmoe_cache  # Local cache on EC2

    # S3 configuration
    s3:
      endpoint_url: null
      region: us-east-1
      use_accelerate: false

    # EC2 instance metadata
    instance_type: p3.2xlarge  # Optional metadata

  # ========================================
  # MODAL EXECUTION (NEW)
  # ========================================
  modal:
    # GPU configuration
    gpu: "A10G:1"  # Modal GPU spec (e.g., "A10G:1", "A100:1", "T4:1")

    # CPU cores
    cpu: 4

    # Timeout in seconds
    timeout: 14400  # 4 hours

    # Modal Volume name for artifact persistence
    volume_name: "tmoe-training-artifacts"

# ============================================================================
# DATA INGESTION CONFIGURATION
# ============================================================================
# Configuration for the data ingestion pipeline.
# Supports both SageMaker-based and direct fallback ingestion.
# Used by: run_pipeline.py
# ============================================================================
data_ingestion:
  # Execution mode control
  use_sagemaker: false  # Set to true to use SageMaker, false for direct S3 upload

  # Dataset ingestion driven dynamically by the `dataset.dataset_key` catalog mapping above.
  dataset_splits: null  # null = all splits, or list: [train, validation, test]

  # SageMaker processing job configuration (only used if use_sagemaker: true)
  sagemaker:
    instance_type: ml.m5.xlarge
    instance_count: 1
    use_spot_instances: false  # Enable for ~70% cost savings
    max_runtime_seconds: 3600

    # HuggingFace container versions
    transformers_version: "4.26"
    pytorch_version: "2.0"
    python_version: "py310"

  # S3 paths (aligned with compute.aws structure)
  s3:
    raw_data_bucket: null  # Set from terraform output OR RAW_DATA_BUCKET env var
    raw_data_prefix: datasets/raw/
    processing_output_prefix: datasets/processed/

  # Processing options
  processing:
    validate_splits: true
    output_format: jsonl  # Options: jsonl, parquet, text
    compression: none  # Options: gzip, none
    max_retries: 3
    log_level: INFO

# ============================================================================
# OUTPUT STRUCTURE (Auto-generated)
# ============================================================================
# Outputs will be saved to:
#   {output_root}/experiments/{experiment_name}_{timestamp}/
#     ├── checkpoints/
#     ├── logs/
#     ├── wandb/
#     └── config.yaml  # Saved copy of this config
# ============================================================================
