[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=xml

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    cuda: marks tests that require CUDA
    integration: marks integration tests

[coverage:run]
source = .
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass$
    ^\s*\.\.\.$
