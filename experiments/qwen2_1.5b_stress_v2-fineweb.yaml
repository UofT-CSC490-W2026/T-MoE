# ============================================================================
# Qwen2-1.5B / SPAR Router (StressCorrectedRouter) — fineweb-edu — v1
# ============================================================================
#
# PRIMARY PAPER EXPERIMENT: SPAR vs. standard / switch / deepseek / expert_choice
#
# Selection:  z_i = cos(x,W_i) - λ·(L_i - 1/N)
# Weight:     w_i = softmax(cos(x,W_i) / τ_t)   [τ anneals 0.5 → 0.10 over 14000 steps]
# Lambda:     auto-calibrated at step 1000 (warmup_steps=800 + 200)
# No auxiliary loss. One free hyperparameter: τ.
# EMA load synced across DDP ranks every step via all_reduce(AVG).
#
# Architecture notes:
#   Qwen2-1.5B hidden_dim=1536 → σ_cos ≈ 1/√1536 ≈ 0.025
#   λ = min(σ_cos · N, 5.0) auto-calibrates to this scale — no manual adjustment.
#   noise_std=0.0: at D=1536 σ_cos≈0.025 < σ_cos(GPT-Neo 125M)≈0.036;
#     Gumbel noise at 0.05 would exceed the routing signal (Δcos≈0.025).
#   init_from_data=true: k-means prototype init from layer activations (v7 finding:
#     highest-leverage improvement; warms cos_sim from ≈0 to ≈0.5 at step 0).
#
# All non-router sections are identical to qwen2_1.5b_standard_v1-fineweb.yaml
# to ensure a fair controlled comparison for Table 1.
# ============================================================================

experiment_name: qwen2_1.5b_stress_v2_fineweb
seed: 42
compile: true

model:
  model_key: qwen2-1.5b
  freeze_backbone: true
  moe_layer_indices: [2, 6, 10, 14, 18, 22]

router:
  type: stress_corrected
  num_experts: 8
  top_k: 2
  temperature: 0.5          # τ_0 — initial output weight sharpness; SPAR's one free hyperparameter
  tau_final: 0.10           # τ at end of annealing; sharpens routing confidence (v7 optimum)
  tau_anneal_steps: 14000   # 73.7% of 19000 steps — same proportion as v7
  noise_std: 0.0            # No exploration noise: σ_cos≈0.025 at D=1536 < noise at 0.05
  eps: 1.0e-3               # Numerical floor; kept for config compatibility
  ema_alpha: 0.01           # Slow EMA (~100-step window); prevents load oscillation on large corpus
  lambda_calib_step: 1000   # warmup_steps(800) + 200; ensures EMA has stabilized before λ is frozen
  lambda_init: 0.1          # pre-calibration λ (steps 0–lambda_calib_step); ~0.5× expected λ_calib (σ_cos≈0.025×N=8→λ≈0.20) — conservative start, auto-corrected at step 1000
  init_from_data: true      # K-means prototype init from layer activations before training begins

expert:
  type: qwen2_lora
  count: 8
  lora:
    rank: 32
    alpha: 32
    dropout: 0.0
    init_scale: 0.01
    b_init_scale: 0.0       # Negligible benefit when k-means init is active (Experiment #17)

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  steps: 19000
  lr: 3.0e-4
  warmup_steps: 800
  weight_decay: 0.1
  save_interval: 1000
  keep_last_n_checkpoints: 10
  eval_interval: 500
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  clip_grad_norm: 1.0
  num_workers: 8

dataset:
  dataset_key: fineweb-edu
  max_seq_len: 2048

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: false

eval:
  stride: 512
  max_documents: null
  max_eval_length: 2048
  batch_size: 64
  lm_harness_batch_size: 16
  limit: null
  seq_len: 2048
  warmup_iters: 10
  benchmark_iters: 100

compute:
  modal:
    gpu: "H100:8"
