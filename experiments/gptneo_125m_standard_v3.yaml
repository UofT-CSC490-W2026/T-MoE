# ============================================================================
# GPT-Neo 125M / Standard Router v3 — Fineweb-edu Baseline
# ============================================================================
#
# Purpose: fair baseline against gptneo_125m_metabolic_v5-fineweb.yaml.
# MUST match metabolic_v5-fineweb exactly except for router type.
#
#   ✓ dataset (fineweb-edu, max_seq_len=1024)
#   ✓ model (gpt-neo-125m, same MoE layer indices)
#   ✓ LoRA config (rank=16, alpha=32, dropout=0.05)
#   ✓ training (lr=3e-4, steps=19000, batch=32, grad_accum=2)
#   ✓ num_experts=8, top_k=2
#   ✓ H100:4
#
# The ONLY difference from metabolic_v5-fineweb:
#   - router.type = standard (aux loss, no fatigue)
#   - temperature=1.0 (conventional default for aux-loss routers)
# ============================================================================

experiment_name: gptneo_125m_standard_v3
seed: 42
compile: true

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: standard
  num_experts: 8
  top_k: 2
  temperature: 1.0
  noise_std: 0.05
  use_aux_loss: true
  aux_loss_coef: 0.01

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

training:
  batch_size: 32
  lr: 3.0e-4
  steps: 19000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 1000
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 2
  clip_grad_norm: 1.0
  num_workers: 2

dataset:
  dataset_key: fineweb-edu
  max_seq_len: 1024

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: true

compute:
  modal:
    gpu: "H100:4"
