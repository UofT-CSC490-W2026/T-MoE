# ============================================================================
# GPT-Neo 125M / Standard Router — Publication Baseline
# ============================================================================
#
# Purpose: Fair baseline for comparison against metabolic_v4.
#
# MUST match metabolic_v4 exactly on:
#   ✓ dataset (wikitext-103)
#   ✓ model (gpt-neo-125m, same MoE layer indices)
#   ✓ LoRA config (rank=16, alpha=32, dropout=0.05)
#   ✓ training (lr=3e-4, steps=5000, warmup=400, batch=16, grad_accum=4)
#   ✓ num_experts=8, top_k=2
#
# The ONLY difference from metabolic_v4:
#   - router.type = standard (uses aux load-balancing loss)
#   - no fatigue, no warmup, no prototype_magnitude
#
# This isolates the router mechanism as the independent variable.
# Run this in parallel with gptneo_125m_metabolic_v4.yaml.
# ============================================================================

experiment_name: gptneo_125m_standard_v2
seed: 42

# ── Model ───────────────────────────────────────────────────────────────────
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# ── Router ──────────────────────────────────────────────────────────────────
router:
  type: standard
  num_experts: 8
  top_k: 2
  temperature: 1.0       # T=1.0 is the conventional default for aux-loss routers;
                         # metabolic_v4 uses T=0.7 (tuned) — documented in paper
  noise_std: 0.05        # matched to metabolic_v4 to isolate router type as the
                         # only independent variable
  use_aux_loss: true
  aux_loss_coef: 0.01    # Switch Transformer standard coefficient

# ── Experts ─────────────────────────────────────────────────────────────────
# Identical to metabolic_v4 — isolates router, not LoRA capacity
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

# ── Training ────────────────────────────────────────────────────────────────
# Identical to metabolic_v4
training:
  batch_size: 16
  lr: 3.0e-4
  steps: 5000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 500
  eval_interval: 500       # eval less frequently to reduce checkpoint I/O blocking;
                           # matches metabolic_v4 effective checkpoint frequency
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 4
  clip_grad_norm: 1.0

# ── Dataset ─────────────────────────────────────────────────────────────────
dataset:
  dataset_key: wikitext-103
  max_seq_len: 512

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  enabled: true
  log_gradients: false
  log_interval: 25

# ── Distributed ─────────────────────────────────────────────────────────────
distributed:
  strategy: ddp
  # Required for the standard router: aux_loss collapses routing early in training,
  # causing some experts to receive 0 tokens and therefore 0 gradient.
  # DDP with find_unused_parameters=False crashes when this happens.
  # The metabolic router avoids this because fatigue prevents expert collapse,
  # so all experts always receive tokens — find_unused_parameters=False works fine.
  find_unused_parameters: true

# ── Compute (Modal) ─────────────────────────────────────────────────────────
# Read by run_modal_training.py at import time to provision the container.
# Change CONFIG at the top of run_modal_training.py to activate this experiment.
compute:
  modal:
    gpu: "A100:4"
