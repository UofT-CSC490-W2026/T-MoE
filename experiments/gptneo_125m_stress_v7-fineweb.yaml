# ============================================================================
# GPT-Neo 125M / SPAR Router — fineweb-edu — v7
# ============================================================================
#
# Key change vs v6: router.init_from_data: true
#   Prototypes W_i are initialized from k-means centroids of actual layer
#   activations (2 warmup batches, 30 k-means iterations) before training.
#   Starts cos_sim ≈ 0.5 instead of ≈ 0 → faster prototype alignment,
#   conf breaks out of 0.52 plateau, gini rises earlier.
#
# Selection:  z_i = cos(x,W_i) - λ·max(0, L_i - 1/N)
# Weight:     w_i = softmax(cos(x,W_i) / τ_t)   [τ anneals 0.5 → 0.12 over 10000 steps]
# Lambda:     auto-calibrated at step 600 (warmup_steps=400 + 200)
# EMA load synced across DDP ranks every step.
#
# ============================================================================

experiment_name: gptneo_125m_stress_v7_fineweb
seed: 42
compile: true

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: stress_corrected
  num_experts: 8
  top_k: 2
  temperature: 0.5        # τ_0; anneals → tau_final over tau_anneal_steps
  tau_final: 0.10         # conf ≈ 0.62 at convergence
  tau_anneal_steps: 14000 # 53% of 19000 steps
  noise_std: 0.05
  noise_anneal_steps: 9500  # anneal noise to 0 by step 9500 (~midpoint of 19000)
  eps: 1.0e-3
  ema_alpha: 0.01
  lambda_calib_step: 600  # warmup_steps(400) + 200
  init_from_data: true    # k-means prototype init from 2 warmup batches

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 32
    alpha: 64
    dropout: 0.05
    init_scale: 0.01
    b_init_scale: 0.01    # Break expert symmetry: small random B init → ∂L/∂w ≠ 0 from step 0

training:
  batch_size: 32
  lr: 3.0e-4
  steps: 19000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 1000
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 2
  clip_grad_norm: 1.0
  num_workers: 2

dataset:
  dataset_key: fineweb-edu
  max_seq_len: 1024

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: false

compute:
  modal:
    gpu: "H100:4"
