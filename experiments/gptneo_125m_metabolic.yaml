# ============================================================================
# GPT-Neo 125M / LoRA MoE with Metabolic Router (Optimized)
# ============================================================================
#
# Metabolic Router features:
# - Fatigue-based load balancing (prevents expert burnout)
# - Age-aware warmup (protects newborn experts)
# - Adaptive cost scaling (adjusts to active expert count)
# - Heavy-tailed dynamics (SoftSign activation)

# Experiment Metadata
experiment_name: gptneo_125m_metabolic_optimized
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  # Inject MoE at every other layer for balanced capacity
  # This gives 6 MoE layers, significantly more adaptation capacity
  # while keeping training stable (alternating pattern like Switch Transformer)
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# Router Configuration - METABOLIC ROUTER
router:
  type: metabolic
  num_experts: 8  # More experts for metabolic dynamics
  top_k: 2  # Select top-2 experts
  temperature: 1.0
  noise_std: 0.1  # Exploration noise during training

  # Metabolic-specific parameters (Optimized)
  metabolic:
    lambda_metabolic: 0.5
    mu_silicon: 0.0
    gamma_recovery: 0.01
    beta_cost: 0.05
    warmup_steps: 200
    normalize_inputs: true
    normalize_weights: true

# Expert Configuration
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1
    init_scale: 0.01

# Training Configuration
training:
  batch_size: 16
  lr: 5.0e-4
  steps: 50          # smoke-test: change back to 3000 for a real run
  warmup_steps: 10
  save_interval: 50
  eval_interval: 25
  log_interval: 10
  optimizer: adamw

# Dataset Configuration
dataset:
  dataset_key: wikitext-2
  max_seq_len: 512

# Logging - Track metabolic metrics in WandB
logging:
  enabled: true
  log_gradients: false
  log_interval: 10
