# ============================================================================
# GPT-Neo 125M / LoRA MoE with Metabolic Router (Stabilized V2)
# ============================================================================
# Changes from V1:
# - Reduced lambda_metabolic (0.1 -> 0.01) to prevent shock switching
# - Increased gamma_recovery (0.01 -> 0.1) to allow faster expert recovery
# - Reduced learning rate (5e-4 -> 1e-4) for stability
#
# Metabolic Router features:
# - Fatigue-based load balancing (prevents expert burnout)
# - Age-aware warmup (protects newborn experts)
# - Adaptive cost scaling (adjusts to active expert count)
# - Heavy-tailed dynamics (SoftSign activation)

# Experiment Metadata
experiment_name: gptneo_125m_metabolic_moe_v2
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [-1]  # Inject MoE at last layer

# Router Configuration - METABOLIC ROUTER
router:
  type: MetabolicRouter
  num_experts: 8  # More experts for metabolic dynamics
  top_k: 2  # Select top-2 experts
  temperature: 1.0
  noise_std: 0.1  # Exploration noise during training

  # Metabolic-specific parameters
  metabolic:
    lambda_metabolic: 0.01  # REDUCED: Fatigue penalty strength (was 0.1)
    mu_silicon: 0.0  # Hardware distance penalty (0.0 = disabled)
    gamma_recovery: 0.1  # INCREASED: Fatigue recovery rate (was 0.01)
    beta_cost: 0.04  # Base fatigue accumulation cost
    warmup_steps: 200  # Steps for newborn expert warmup
    normalize_inputs: true  # Use cosine similarity for alignment
    normalize_weights: true  # Normalize expert prototypes

# Expert Configuration
expert:
  type: LoRA
  count: 8  # Matches num_experts
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1

# Training Configuration
training:
  batch_size: 16
  lr: 1.0e-4  # REDUCED: For stability (was 5.0e-4)
  steps: 3000  # Longer training to see metabolic dynamics
  warmup_steps: 200
  save_interval: 500
  eval_interval: 200
  log_interval: 50  # More frequent logging for metabolic metrics

# Dataset Configuration
dataset:
  dataset_key: wikitext-2
  max_seq_len: 512

# Logging - Track metabolic metrics in WandB
logging:
  enabled: true
  log_gradients: false
  log_interval: 50
