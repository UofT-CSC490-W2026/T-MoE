# ============================================================================
# GPT-Neo 125M / LoRA MoE with Metabolic Router v2 (Differential Fatigue)
# ============================================================================
#
# Key changes from v1:
# - Differential fatigue: F_i tracks EXCESS usage (U_i - 1/N)
#   → Balanced experts: F≈0 (no penalty)
#   → Overloaded experts: F>0 (SoftSign penalty)
#   → Neglected experts: F<0 (SoftSign bonus)
# - Recalibrated β/γ/λ so 2× overloaded expert hits SoftSign(1.0) = 0.5
#
# Proposed A parameters (strongest signal)

# Experiment Metadata
experiment_name: gptneo_125m_metabolic_v2
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# Router Configuration - METABOLIC ROUTER v2
router:
  type: metabolic
  num_experts: 8
  top_k: 2
  temperature: 1.0
  noise_std: 0.1

  # Metabolic v2 parameters (Differential Fatigue)
  metabolic:
    lambda_metabolic: 0.5     # λ: max penalty bounded at ±0.5 by SoftSign
    mu_silicon: 0.0
    gamma_recovery: 0.05     # γ: recovery rate (higher → faster equilibrium)
    beta_cost: 0.4           # β: cost rate (β=8γ targets SoftSign sweet spot)
    warmup_steps: 200
    normalize_inputs: true
    normalize_weights: true

# Expert Configuration
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1
    init_scale: 0.01

# Training Configuration
training:
  batch_size: 16
  lr: 5.0e-4
  steps: 3000
  warmup_steps: 200
  save_interval: 500
  eval_interval: 200
  log_interval: 50
  optimizer: adamw
  early_stopping_patience: 100
  gradient_accumulation_steps: 4

# Dataset Configuration
dataset:
  dataset_key: wikitext-2
  max_seq_len: 512

# Logging
logging:
  enabled: true
  log_gradients: false
  log_interval: 50
