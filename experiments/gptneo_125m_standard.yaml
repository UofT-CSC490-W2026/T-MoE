# ============================================================================
# GPT-Neo 125M / LoRA MoE with STANDARD Router (Baseline)
# ============================================================================
#
# Standard Router features:
# - Normal Token-Choice Routing (Switch/GShard style)
# - Auxiliary Load Balancing Loss
#
# Use this config to benchmark against the Metabolic Router.

# Experiment Metadata
experiment_name: gptneo_125m_standard_baseline
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  # Inject MoE at every other layer for balanced capacity
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# Router Configuration - STANDARD ROUTER
router:
  type: standard
  num_experts: 8
  top_k: 2  # Select top-2 experts
  temperature: 1.0
  use_aux_loss: true  # CRITICAL: Forces balance in standard MoE
  aux_loss_coef: 0.01  # Standard Switch Transformer penalty weight

# Expert Configuration
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1
    init_scale: 0.01

# Training Configuration
training:
  batch_size: 16
  lr: 5.0e-4
  steps: 3000
  warmup_steps: 200
  save_interval: 500
  eval_interval: 200
  log_interval: 50
  optimizer: adamw
  early_stopping_patience: 100
  gradient_accumulation_steps: 4

# Dataset Configuration
dataset:
  dataset_key: wikitext-2
  max_seq_len: 512

# Logging
logging:
  enabled: true
  log_gradients: false
  log_interval: 50
