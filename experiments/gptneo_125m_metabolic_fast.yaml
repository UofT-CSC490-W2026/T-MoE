# ============================================================================
# GPT-Neo 125M / LoRA MoE with Metabolic Router — FAST ITERATION
# ============================================================================
#
# Purpose: Rapid router hyperparameter tuning and debugging
# Runtime: ~10-15 minutes on A100×1, ~5-8 minutes on A100×4
#
# Optimizations:
# - Single GPU (or 2 GPUs for faster iteration)
# - Reduced steps (500) with early stopping
# - Frequent evals (every 50 steps) to catch convergence quickly
# - Smaller dataset (wikitext-2) for fast data loading
# - Aggressive early stopping (50 eval intervals = 2,500 steps max)

# Experiment Metadata
experiment_name: gptneo_125m_metabolic_fast
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]  # 6 MoE layers

# Router Configuration — METABOLIC ROUTER
router:
  type: metabolic
  num_experts: 8
  top_k: 2
  temperature: 1.0
  noise_std: 0.1

  # Metabolic parameters (tune these for router experiments)
  metabolic:
    lambda_metabolic: 0.5     # λ: penalty strength
    mu_silicon: 0.0           # silicon tax (disabled)
    gamma_recovery: 0.05      # γ: recovery rate
    beta_cost: 0.4           # β: cost rate (β/γ = 8.0)
    warmup_steps: 50          # shorter warmup for fast iteration
    normalize_inputs: true
    normalize_weights: true
    magnitude_min: 0.1
    magnitude_max: 5.0

# Expert Configuration
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1
    init_scale: 0.01

# Training Configuration — OPTIMIZED FOR SPEED
training:
  batch_size: 32             # larger batch for single GPU (fits in memory)
  lr: 5.0e-4
  steps: 500                 # reduced from 750 — early stopping will catch convergence
  warmup_steps: 50           # 10% warmup (faster)
  save_interval: 100          # save every 100 steps
  eval_interval: 50          # eval every 50 steps (10 evals total) — frequent for fast feedback
  log_interval: 10           # log every 10 steps (frequent monitoring)
  optimizer: adamw
  early_stopping_patience: 50  # stop if no improvement for 50 eval intervals (2,500 steps max)
  gradient_accumulation_steps: 2  # effective batch = 32 × 2 = 64 per GPU

# Dataset Configuration
dataset:
  dataset_key: wikitext-2    # small dataset for fast loading
  max_seq_len: 512

# Logging
logging:
  enabled: true
  log_gradients: false
  log_interval: 10

# ============================================================================
# DISTRIBUTED TRAINING — SINGLE OR DUAL GPU FOR FAST ITERATION
# ============================================================================
distributed:
  num_gpus: 1                # single GPU for fastest iteration (or 2 for 2× speedup)
  strategy: ddp

# ============================================================================
# COMPUTE CONFIGURATION
# ============================================================================
compute:
  modal:
    gpu: "A100:1"             # single A100 for cost efficiency (or "A100:2" for 2× speed)
