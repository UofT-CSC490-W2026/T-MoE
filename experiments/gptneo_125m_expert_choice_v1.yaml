experiment_name: gptneo_125m_expert_choice_v1
seed: 42

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: expert_choice
  num_experts: 8
  top_k: 2
  temperature: 1.0       
  noise_std: 0.05

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

training:
  batch_size: 16
  lr: 3.0e-4
  steps: 5000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 500
  eval_interval: 500
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 4
  clip_grad_norm: 1.0

dataset:
  dataset_key: wikitext-103
  max_seq_len: 512

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: true

compute:
  modal:
    gpu: "A100:4"
