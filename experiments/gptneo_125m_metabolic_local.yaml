# ============================================================================
# GPT-Neo 125M / LoRA MoE with Metabolic Router (FULL LOCAL TRAINING)
# ============================================================================

# Experiment Metadata
experiment_name: gptneo_125m_metabolic_local
seed: 42

# Model Configuration
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# Router Configuration
router:
  type: metabolic
  num_experts: 8
  top_k: 2
  temperature: 1.0
  noise_std: 0.1
  metabolic:
    lambda_metabolic: 0.5
    mu_silicon: 0.0
    gamma_recovery: 0.01
    beta_cost: 0.05
    warmup_steps: 200
    normalize_inputs: true
    normalize_weights: true

# Expert Configuration
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 16
    dropout: 0.1
    init_scale: 0.01

# Training Configuration (full run)
training:
  batch_size: 4
  gradient_accumulation_steps: 4
  lr: 5.0e-4
  steps: 3000
  warmup_steps: 200
  save_interval: 500
  eval_interval: 200
  log_interval: 50
  optimizer: adamw

# Dataset Configuration
dataset:
  dataset_key: wikitext-2
  max_seq_len: 512

# Disable wandb for local run
logging:
  enabled: false
  mode: disabled

# Force local run without Slurm
compute:
  local:
    slurm:
      enabled: false
