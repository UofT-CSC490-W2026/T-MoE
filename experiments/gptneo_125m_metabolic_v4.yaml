# ============================================================================
# GPT-Neo 125M / Metabolic Router v4 — Production Run (fineweb-edu)
# ============================================================================
#
# Note: v2/v3 and the ablation comparison against standard_v2 were run on
# wikitext-103 for fast validation. This config moves to fineweb-edu (10B
# tokens) for real experiments.
# ============================================================================
#
# Scientific purpose:
#   The definitive metabolic router experiment combining:
#     Fix 1 (v3): Global λ warmup — penalty ramps 0→λ over warmup_steps.
#                 Prevents gate from locking into biased directions before
#                 fatigue has built up. Confirmed working in v3 (Layer 1
#                 stayed uniform gini<0.18 through step 400).
#     Fix 2 (v3): Token-count usage for fatigue — uniform 1/top_k per
#                 selection instead of softmax weights. More stable.
#     Fix 3 (v4): Restore λ=0.5. v3 used λ=0.3 which was too weak
#                 post-warmup — Layer 1 collapsed to gini=0.59 by step 2350.
#                 λ=0.5 was sufficient in v2 to limit L1 to gini≈0.43.
#                 With warmup now preventing early lock-in, λ=0.5 should
#                 produce: good initial routing + strong post-warmup balance.
#
# v4 hypothesis:
#   warmup=400 (prevents early lock-in) + λ=0.5 (prevents post-warmup
#   collapse) = lower gini at L1 than either v2 or v3, with val_loss ≤ v3.
#
# Ablation context (all on wikitext-103, matched architecture):
#   standard_v2 (baseline):  aux-loss router, λ warmup N/A
#   v3: metabolic, warmup=400, λ=0.3 → warmup works, λ too weak (val≈3.13)
#   v4: metabolic, warmup=400, λ=0.5 → EXPECTED BEST
#   v4: metabolic with fine web edu λ=0.5 did not perform good enough. so changed to 1.0
# Run alongside gptneo_125m_standard_v2.yaml for publication comparison.
#
# Runtime: ~6 hours on 4× H100 (19k steps × ~1.1 sec/step at seq_len=1024)
# ============================================================================

experiment_name: gptneo_125m_metabolic_v4
seed: 42
compile: true  # torch.compile on backbone — 1.5-2× speedup on H100

# ── Model ───────────────────────────────────────────────────────────────────
model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

# ── Router ──────────────────────────────────────────────────────────────────
router:
  type: metabolic
  num_experts: 8
  top_k: 2
  temperature: 0.7
  noise_std: 0.05

  metabolic:
    # KEY CHANGE FROM v3: λ restored to 0.5 (was 0.3 — too weak post-warmup).
    # At equilibrium for a 2× overloaded expert:
    #   F_eq = (β/γ) × excess = 8 × (1/8) = 1.0
    #   penalty = λ × SoftSign(1.0) = 0.5 × 0.5 = 0.25
    # This was sufficient in v2 to contain L1 at gini≈0.43.
    # With warmup preventing early directional bias, expect better.
    lambda_metabolic: 1


    # β/γ = 0.4/0.05 = 8.0 — unchanged across v2/v3/v4.
    gamma_recovery: 0.05
    beta_cost: 0.4

    # warmup_steps: gate sees task loss only for first 400 steps before
    # fatigue penalty activates. Confirmed working in v3.
    warmup_steps: 400


# ── Experts ─────────────────────────────────────────────────────────────────
expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

# ── Training ────────────────────────────────────────────────────────────────
training:
  batch_size: 32            # was 16 — H100 has 80GB, 125M uses ~10GB, plenty of headroom
  lr: 3.0e-4
  steps: 19000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 1000
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 2  # was 4 — global batch stays 32×2×4=256, fewer accum loops
  clip_grad_norm: 1.0

# ── Dataset ─────────────────────────────────────────────────────────────────
dataset:
  dataset_key: fineweb-edu
  max_seq_len: 1024  # ShardDataset reads seq_len+1 tokens; GPT-Neo 125M max_position_embeddings=2048

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  enabled: true
  log_gradients: false
  log_interval: 25

# ── Distributed ─────────────────────────────────────────────────────────────
distributed:
  strategy: ddp

# ── Compute (Modal) ─────────────────────────────────────────────────────────
# Read by run_modal_training.py at import time to provision the container.
# Change CONFIG at the top of run_modal_training.py to activate this experiment.
compute:
  modal:
    gpu: "H100:4"
