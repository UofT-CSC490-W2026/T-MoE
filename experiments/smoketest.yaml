# CI smoke test only — 2 steps, not for real runs.
experiment_name: smoketest
seed: 42

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: standard
  num_experts: 8
  top_k: 2
  temperature: 0.7
  noise_std: 0.05
  metabolic:
    lambda_metabolic: 0.5
    gamma_recovery: 0.05
    beta_cost: 0.4
    warmup_steps: 0

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

training:
  batch_size: 2
  lr: 3.0e-4
  steps: 2
  warmup_steps: 0
  save_interval: 2
  eval_interval: 2
  log_interval: 1
  optimizer: adamw
  gradient_accumulation_steps: 1

dataset:
  dataset_key: wikitext-2
  max_seq_len: 128

logging:
  enabled: false
  log_interval: 1

distributed:
  strategy: ddp

compute:
  modal:
    gpu: "A100:1"

eval:
  stride: 128
  max_documents: 5
  max_eval_length: 128
  batch_size: 2
  lm_harness_batch_size: 2
  limit: 5
  seq_len: 128
  warmup_iters: 2
  benchmark_iters: 5
