# ============================================================================
# GPT-Neo 125M / StressCorrectedRouter (SPAR) — fineweb-edu
# ============================================================================
#
# Selection:  z_i = cos(x,W_i) - λ·max(0, L_i - 1/N)
# Weight:     w_i = softmax(cos(x,W_i) / τ_t)   [τ anneals 0.5 → 0.12 over 10000 steps]
# Lambda:     auto-calibrated at step 600 (warmup_steps=400 + 200)
# EMA load synced across DDP ranks every step.
#
# ============================================================================

experiment_name: gptneo_125m_stress_v6_fineweb
seed: 42
compile: true

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: stress_corrected
  num_experts: 8
  top_k: 2
  temperature: 0.5        # τ_0; anneals → tau_final over tau_anneal_steps
  tau_final: 0.12         # conf ≈ 0.62 at convergence
  tau_anneal_steps: 10000 # 53% of 19000 steps
  noise_std: 0.05
  eps: 1.0e-3
  ema_alpha: 0.01
  lambda_calib_step: 600  # warmup_steps(400) + 200
  # init_from_data: false  # set true in v7 to enable k-means prototype initialization

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

training:
  batch_size: 32
  lr: 3.0e-4
  steps: 19000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 1000
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 2
  clip_grad_norm: 1.0
  num_workers: 2

dataset:
  dataset_key: fineweb-edu
  max_seq_len: 1024

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: false

compute:
  modal:
    gpu: "H100:4"
