# ============================================================================
# GPT-Neo 125M / Metabolic Router v5 — Closed Escape Hatches
# ============================================================================
#
# Changes from v4 (fineweb-edu λ=1.0 run showed same drift as λ=0.5, just slower):
#
#   Escape hatch 1 (SoftSign ceiling): CLOSED
#     SoftSign(F_i) ∈ (-1,1) hard-capped the penalty at λ. A sufficiently
#     preferred expert would pay the max penalty and still win. Raw F_i grows
#     proportionally — a 4x overloaded expert pays 4x the penalty.
#     → penalty: λ * SoftSign(F_i)  →  λ * F_i
#
#   Escape hatch 2 (learnable g_i inflation): CLOSED
#     prototype_magnitude was a learnable scalar the optimizer inflated to
#     make its favourite experts' semantic term dwarf the fatigue penalty.
#     With magnitude_max=8, the gate could produce logits up to 8 vs λ=1 penalty.
#     → routing potential: g_i * cos(x,W_i) - λ*F_i  →  cos(x,W_i) - λ*F_i
#
# λ recalibration: raw F_i at equilibrium gives 2x the SoftSign penalty.
#   λ=0.3 with raw F_i ≈ λ=0.6 with SoftSign at equilibrium.
#   For severely overloaded experts (F >> 1), the unbounded penalty dominates.
#
# ============================================================================

experiment_name: gptneo_125m_metabolic_v5
seed: 42
compile: false  # mixed GPTNeoMLP/LoRAMoELayer types cause dynamo recompile limit → eager fallback anyway

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]

router:
  type: metabolic
  num_experts: 8
  top_k: 2
  temperature: 0.7
  noise_std: 0.05

  metabolic:
    lambda_metabolic: 1.0   # in cosine space [-1,1]: exceeds max trained gate advantage (~0.3-0.6)
    gamma_recovery: 0.05
    beta_cost: 0.4           # β/γ = 8.0 — equilibrium F = 8 × excess_usage
    warmup_steps: 400        # give gate time to find clean directions before fatigue fires

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    init_scale: 0.01

training:
  batch_size: 16
  lr: 3.0e-4
  steps: 5000
  warmup_steps: 200
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 500
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 4  # global batch = 16×4×4 = 256
  clip_grad_norm: 1.0
  num_workers: 2  # 4 DDP ranks × 2 workers = 8 memmap processes (vs 16 with default 4, avoids /dev/shm deadlock)

dataset:
  dataset_key: wikitext-103
  max_seq_len: 512

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp

compute:
  modal:
    gpu: "A100:4"
