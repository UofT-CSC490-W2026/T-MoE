# ============================================================================
# GPT-Neo 125M / SPAR Router — fineweb-edu — v8b
# ============================================================================
#
# LoRA Without Regret corrections applied (Schulman et al., Sep 2025):
#
# [Finding 1] alpha = rank (scaling = 1.0 is optimal).
#   v8a: rank=32, alpha=64  → scaling=2.0
#   v8b: rank=32, alpha=32  → scaling=1.0
#   v8a: shared_base_alpha=16.0 on shared_base_rank=8 → scaling=2.0
#   v8b: shared_base_alpha=8.0  on shared_base_rank=8 → scaling=1.0
#
# [Finding 3] Large batch size hurts LoRA more than FullFT.
#   v8a: batch_size=32, grad_accum=2 → effective batch=64
#   v8b: batch_size=16, grad_accum=2 → effective batch=32
#   Note: reducing effective batch, not just micro-batch — the penalty is
#   on the effective gradient batch, which is the quantity that matters for
#   the eNTK / lazy-training regime argument in the paper.
#
# [Finding 5 — NOT applied] Paper says "apply LoRA to all layers" for eNTK.
#   This means don't skip transformer layers when placing LoRA adapters.
#   It does NOT mean convert all FFNs to MoE — MoE layer placement is
#   explicitly listed as an open question in the paper. Converting all 12
#   FFN layers to MoE is a separate architectural decision not supported by
#   this finding. moe_layer_indices reverted to every-other-layer [1,3,5,7,9,11].
#
# [Finding 2] LoRA LR = 10× FullFT LR. FullFT LR for GPT-Neo-125M ≈ 3e-5,
#   so LoRA LR ≈ 3e-4 — already correct. No change.
#
# [Finding 4] MLP-only LoRA is optimal. Already correct in SPAR. No change.
#
# [b_init_scale fix] b_init_scale: 0.01 → 0.0. Zero-init B is the standard LoRA
#   guarantee (adapter contributes zero delta at init). Non-zero breaks MoE expert
#   symmetry — experts start with random deltas, some randomly preferred before any
#   gradient signal. See src/experts/lora.py comment.
#
# All router hyperparameters identical to v8a — isolated ablation.
# ============================================================================

experiment_name: gptneo_125m_stress_v8b_fineweb
seed: 42
compile: true

model:
  model_key: gpt-neo-125m
  freeze_backbone: true
  moe_layer_indices: [1, 3, 5, 7, 9, 11]  # every-other layer; "all layers" finding in paper is about LoRA adapter coverage, not MoE placement

router:
  type: stress_corrected
  num_experts: 8
  top_k: 2
  temperature: 0.5
  tau_final: 0.10
  tau_anneal_steps: 14000
  noise_std: 0.05
  noise_anneal_steps: 9500
  eps: 1.0e-3
  ema_alpha: 0.01
  lambda_calib_step: 600
  init_from_data: true

expert:
  type: gpt_neo_lora
  count: 8
  lora:
    rank: 32
    alpha: 32          # was 64 (scaling=2.0) → now 32 (scaling=1.0); Finding 1
    dropout: 0.05
    init_scale: 0.01
    # b_init_scale=0.0: zero-init B restores LoRA zero-delta guarantee and expert symmetry at init
    b_init_scale: 0.02
    shared_base_rank: 0
    shared_base_alpha: 8.0   # was 16.0 (scaling=2.0) → now 8.0 (scaling=1.0); Finding 1

training:
  batch_size: 16             # was 32; effective batch 32 vs 64 in v8a; Finding 3
  lr: 3.0e-4
  steps: 19000
  warmup_steps: 400
  weight_decay: 0.1
  save_interval: 1000
  eval_interval: 1000
  log_interval: 25
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  gradient_accumulation_steps: 2   # effective batch = 16 × 2 = 32
  clip_grad_norm: 1.0
  num_workers: 2

dataset:
  dataset_key: fineweb-edu
  max_seq_len: 1024

logging:
  enabled: true
  log_gradients: false
  log_interval: 25

distributed:
  strategy: ddp
  find_unused_parameters: false

eval:
  # Perplexity
  stride: 2048           # non-overlapping windows — standard for paper numbers
  max_documents: null     # set to null for full dataset (paper runs)
  max_eval_length: 2048  # context length cap; matches GPT-Neo training context
  batch_size: 16              # paper uses 16 for GPT-Neo-125M, but may need to reduce for memory with longer context and MoE overhead; v8a used 8 to fit on A100-40GB with batch_size=32 training; keep same for fair comparison

  # LM Harness
  lm_harness_batch_size: 32
  limit: null            # set to e.g. 100 for fast smoke-tests

  # Efficiency profiling
  seq_len: 1024
  warmup_iters: 10
  benchmark_iters: 100

compute:
  modal:
    gpu: "H100:4"
