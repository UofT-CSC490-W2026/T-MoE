name: Test

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term --cov-report=xml | tee coverage.txt
      - name: Extract coverage percentage
        run: |
          COVERAGE=$(grep '^TOTAL' coverage.txt | awk '{print $NF}')
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
      - name: Update README.md with coverage badge
        run: |
          NUM=$(echo "$COVERAGE" | tr -d '%')
          if [ "$(echo "$NUM >= 80" | bc)" -eq 1 ]; then COLOR="brightgreen"
          elif [ "$(echo "$NUM >= 60" | bc)" -eq 1 ]; then COLOR="yellow"
          else COLOR="red"; fi
          sed -i "s|!\[Coverage\](https://img.shields.io/badge/coverage-.*)|![Coverage](https://img.shields.io/badge/coverage-${COVERAGE}25-${COLOR})|" README.md
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "Update coverage to $COVERAGE"
            git push
          }
